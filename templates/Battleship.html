
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='battleship.css') }}">
      
</head>

<body>

    <h1>Battleship</h1>

    <div class="board-container">

        <!-- Top Labels -->
        <div class="top-labels">
            <div class="corner"></div>
            <div>A</div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
            <div>E</div>
            <div>F</div>
            <div>G</div>
            <div>H</div>
            <div>I</div>
            <div>J</div>
        </div>

        <!-- Game Grid -->
        <div class="board">

            {% for row in range(1, 11) %}

                <div class="row-label">{{ row }}</div>

                {% for col in range(10) %}

                    <div class="cell"
                         id="{{ ('ABCDEFGHIJ'[col]) }}{{ row }}">
                    </div>

                {% endfor %}

            {% endfor %}

        </div>
            <div class="button-container">
                <button id="ready-button">
                    Ready
                </button>
            </div>
    </div>

    <!-- Milestone 2: Create detailed ships on the Battleship board -->
    <script>

        let selectedShip = null;
        let draggedShip = null;

        const ships = [];

        function clearHighlights(){
            document
                .querySelectorAll(".valid-drop, .invalid-drop")
                .forEach(cell =>{
                    cell.classList.remove(
                        "valid-drop", 
                        "invalid-drop"
                    );
            });
        }
        function getCoveredCells(startCellId,length, direction){
            const letters = "ABCDEFGHIJ";
            const startCol =
                letters.indexOf(startCellId[0]);
            const startRow =
            parseInt(startCellId.substring(1));
            const cells = [];
            for (let i = 0; i < length; i++){
                let col = startCol;
                let row = startRow;
                if (direction === "horizontal"){
                    col += i;
                } else {
                    row += i;
                }
                if (
                    col < 0 ||
                    col > 9 ||
                    row < 1 ||
                    row > 10
                ){
                    return null;
                }
                cells.push(
                    letters[col] + row
                );
            }
            return cells;
        }

        // Milestone 2: Create a ship using its starting cell, length, and direction
        function createShip(startCell, length, direction, shipType) {

            // Milestone 2: Find the starting cell
            const cell = document.getElementById(startCell);

            if (!cell) {
                return;
            }

            // Milestone 2: Create the main ship container
            const ship = document.createElement("div");
            ship.classList.add("ship", direction, shipType);

            ship.dataset.direction = direction;
            ship.dataset.length = length;
            ship.dataset.shipType = shipType;
            ship.dataset.startCell = startCell;

            ships.push(ship);

            // Milestone 2: Set the ship size based on its length
            const shipLength = length * 50 - 8;
            ship.style.width = shipLength + "px";
            ship.style.height = "34px";

            // Milestone 2: Create the metallic ship hull
            const hull = document.createElement("div");
            hull.classList.add("ship-hull");
            ship.appendChild(hull);

            // Milestone 2: Create the raised deck
            const deck = document.createElement("div");
            deck.classList.add("ship-deck");
            ship.appendChild(deck);

            // Milestone 2: Create the command bridge
            const bridge = document.createElement("div");
            bridge.classList.add("ship-bridge");
            ship.appendChild(bridge);

            // Milestone 2: Create the front gun turret
            const frontTurret = document.createElement("div");
            frontTurret.classList.add("ship-turret", "front-turret");
            ship.appendChild(frontTurret);

            // Milestone 2: Create the rear gun turret
            const rearTurret = document.createElement("div");
            rearTurret.classList.add("ship-turret", "rear-turret");
            ship.appendChild(rearTurret);

            // Milestone 2: Add small details to the ship deck
            const detail = document.createElement("div");
            detail.classList.add("ship-detail");
            ship.appendChild(detail);

            ship.style.transformOrigin = "center center";
            if (direction === "vertical") {
                ship.style.transform = "translate(-50%, -50%) rotate(90deg)";
            } else {
                ship.style.transform = "translate(-50%, -50%);"
            }

            ship.draggable = true;
            ship.addEventListener("dragstart", function(event) {
                draggedShip = ship;
            });

            // Milestone 2: Add the completed ship to the board
            cell.appendChild(ship);
        }

        // Milestone 2: starting position for ships
        createShip("A1", 5, "horizontal", "carrier");
        createShip("G2", 4, "vertical", "battleship");
        createShip("B5", 3, "horizontal", "cruiser");
        createShip("F8", 3, "horizontal", "submarine");
        createShip("J7", 2, "vertical", "destroyer");

        document.addEventListener("click", function(event){
            const ship = event.target.closest(".ship");
            if (!ship) {
                return;
            }
            if(selectedShip) {
                selectedShip.classList.remove("selected");
            }
            selectedShip = ship;
            selectedShip.classList.add("selected");
        });

        // using r to rotate ships 
        document.addEventListener("keydown", function(event) {
            if (!selectedShip) {
                return;
            }
            if (event.key !== "ArrowLeft" &&
                event.key !== "ArrowRight") {
                return;
            }
            if (selectedShip.dataset.direction === "horizontal") {
                selectedShip.dataset.direction = "vertical";
                selectedShip.style.transform = "translate(-50%, -50%) rotate(90deg)";
            } else {
                selectedShip.dataset.direction = "horizontal";
                selectedShip.style.transform = "translate(-50%, -50%)";
            }
        });

        document.querySelectorAll(".cell").forEach(cell => {

            cell.addEventListener("dragover", function(event) {
                event.preventDefault();
        
                if(!draggedShip){
                    return;
                }
                clearHighlights();

                const cells= 
                    getCoveredCells(
                        cell.id,
                        parseInt(draggedShip.dataset.length),
                        draggedShip.dataset.direction
                );

            if (cells === null) {
                cell.classList.add("invalid-drop");
                return;
            }
            
            cells.forEach(id => {
                document
                .getElementById(id)
                .classList.add("valid-drop");
            });
        
        });
        cell.addEventListener("dragleave", function(event) {
            clearHighlights();
        });

        cell.addEventListener("drop", function(event) {
            event.preventDefault();

            if(!draggedShip){
                return;
            }
            cell.appendChild(draggedShip);
            draggedShip.dataset.startCell = cell.id;
            clearHighlights();
            draggedShip = null;
        });
    });     

    

        // saves ship location after submission 
        function collectShips(){
            const shipData = [];
            ships.forEach(ship => {
                shipData.push({
                    startCell: ship.dataset.startCell,
                    length: (ship.dataset.length),
                    direction: ship.dataset.direction,
                    type: ship.dataset.shipType
            });
        });
        return shipData;
    }

    document
    .getElementById("ready-button")
    .addEventListener("click", function(){
        fetch("/save_ships",{
            method: "POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
            room_code: localStorage.getItem("roomCode"),
            player: localStorage.getItem("playerRole"),
            ships: collectShips()
            })
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
        });
    });


    </script>
        
</body>
</html>
