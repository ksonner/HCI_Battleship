
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='battleship.css') }}">

</head>

<body>

    <h1>Battleship</h1>

    <div class="board-container">

        <!-- Top Labels -->
        <div class="top-labels">
            <div class="corner"></div>
            <div>A</div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
            <div>E</div>
            <div>F</div>
            <div>G</div>
            <div>H</div>
            <div>I</div>
            <div>J</div>
        </div>

        <!-- Game Grid -->
        <div class="board">

            {% for row in range(1, 11) %}

                <div class="row-label">{{ row }}</div>

                {% for col in range(10) %}

                    <div class="cell"
                         id="{{ ('ABCDEFGHIJ'[col]) }}{{ row }}">
                    </div>

                {% endfor %}

            {% endfor %}

        </div>
            <div class="button-container">
                <button id="randomize-button">
                    Randomize
                </button>
                <button id="ready-button">
                    Ready
                </button>
            </div>
    </div>

    <!-- Milestone 2: Create detailed ships on the Battleship board -->
    <script>
        cellList = document.getElementsByClassName("cell");

        grid = [];

        for (const element of cellList) {
            grid.push(element.id);
        };

        let selectedShip = null;
        let draggedShip = null;

        dragOffset = 0;

        ships = [];
        fakeShip = null;

        gameStart = false;

        function clearHighlights() {
            document
                .querySelectorAll(".valid-drop, .invalid-drop")
                .forEach(cell =>{
                    cell.classList.remove(
                        "valid-drop",
                        "invalid-drop"
                    );
            });
        };

        function getCoveredCells(startCellId, length, direction) {
            if (startCellId === undefined) {
                return null;
            };
            const startCol = letters.indexOf(startCellId[0]);
            const startRow = parseInt(startCellId.substring(1));
            const cells = [];
            for (let i = 0; i < length; i++) {
                let col = startCol;
                let row = startRow;
                if (direction === "horizontal") {
                    col += i;
                } else {
                    row += i;
                };
                if (col < 0 || col > 9 || row < 1 || row > 10) {
                    return null;
                };
                cells.push(letters[col] + row);
            };
            return cells;
        };

        // Milestone 2: Create a ship using its starting cell, length, and direction
        function createShip(startCell, length, direction, shipType, offset = 0, fake = false) {

            // Milestone 2: Find the starting cell
            const cell = document.getElementById(startCell);

            if (!cell) {
                return;
            };

            // Milestone 2: Create the main ship container
            const ship = document.createElement("div");
            const inner = document.createElement("div");
            ship.id = shipType;
            ship.classList.add("ship", direction, shipType);
            inner.classList.add("ship-inner", direction);

            if (fake) {
                ship.classList.add("fake", "selected");
            };

            ship.dataset.direction = direction;
            ship.dataset.length = length;
            ship.dataset.shipType = shipType;
            ship.dataset.startCell = startCell;

            if (fake) {
                fakeShip = ship;
            } else {
                ships.push(ship);
            };

            // Milestone 2: Set the ship size based on its length
            ship.style.width = length * 50 + "px";
            ship.style.height = "50px";

            const shipLength = length * 50 - 8;
            inner.style.width = shipLength + "px";
            inner.style.height = "34px";
            inner.style.top = "8px";
            inner.style.left = "4px";

            // Milestone 2: Create the metallic ship hull
            const hull = document.createElement("div");
            hull.classList.add("ship-hull");
            inner.appendChild(hull);

            // Milestone 2: Create the raised deck
            const deck = document.createElement("div");
            deck.classList.add("ship-deck");
            inner.appendChild(deck);

            // Milestone 2: Create the command bridge
            const bridge = document.createElement("div");
            bridge.classList.add("ship-bridge");
            inner.appendChild(bridge);

            // Milestone 2: Create the front gun turret
            const frontTurret = document.createElement("div");
            frontTurret.classList.add("ship-turret", "front-turret");
            inner.appendChild(frontTurret);

            // Milestone 2: Create the rear gun turret
            const rearTurret = document.createElement("div");
            rearTurret.classList.add("ship-turret", "rear-turret");
            inner.appendChild(rearTurret);

            // Milestone 2: Add small details to the ship deck
            const detail = document.createElement("div");
            detail.classList.add("ship-detail");
            inner.appendChild(detail);

            if (direction === "horizontal") {
                shipLeft = ((offset * 50) - 1).toString().concat("px");
                ship.style.left = shipLeft;
                ship.style.top = "-1px";
            } else {
                ship.style.left = "49px";
                shipTop = ((offset * 50) - 1).toString().concat("px");
                ship.style.top = shipTop;
                ship.style.transformOrigin = "top left";
                ship.style.transform = "rotate(90deg)";
            };

            ship.draggable = true;
            ship.addEventListener("dragstart", function(event) {
                //console.log(document.elementsFromPoint(event.clientX, event.clientY));
                draggedShip = ship;
            });

            ship.addEventListener("mouseover", function(event) {
                for (i = 0; i < shipStartCells.length; i++) {
                    if (shipStartCells[i] === ship.dataset.startCell) {
                        if (occupiedCells[i] !== ship.dataset.startCell) {
                            document.getElementById(occupiedCells[i]).classList.add("hover");
                        };
                    };
                };
            });

            ship.addEventListener("mouseleave", function(event) {
                for (i = 0; i < shipStartCells.length; i++) {
                    if (shipStartCells[i] === ship.dataset.startCell) {
                        if (occupiedCells[i] !== ship.dataset.startCell) {
                            document.getElementById(occupiedCells[i]).classList.remove("hover");
                        };
                    };
                };
            });

            // Milestone 2: Add the completed ship to the board
            ship.appendChild(inner);
            cell.appendChild(ship);
        };

        letters = "ABCDEFGHIJ";

        function initShip(length, random, x, y, rotation) {
            collision = false;
            do {
                collision = false;
                if (random) {
                    x = Math.floor(Math.random() * 10 + 1);
                    y = Math.floor(Math.random() * 10 + 1);
                    r = Math.floor(Math.random() * 2);
                    if (r === 0 && (x + length) < 12) {
                        rotation = "horizontal";
                    } else if (r === 1 && (y + length) < 12) {
                        rotation = "vertical";
                    } else {
                        collision = true;
                    };
                } else {
                    if ((rotation === "horizontal" && (x + length) > 11) || (rotation === "vertical" && (y + length) > 11)) {
                        collision = true;
                    };
                };

                position = letters[x - 1].concat(y.toString());
                if (!collision) {
                    cells = [];
                    startCells = [];
                    cells.push(position);
                    startCells.push(position);
                    for (let i = 1; i < length; i++) {
                        var x1;
                        var y1;
                        if (rotation === "horizontal") {
                            x1 = i + x;
                            y1 = y
                        } else {
                            x1 = x;
                            y1 = i + y;
                        };
                        pos = letters[x1 - 1].concat(y1.toString());
                        cells.push(pos);
                        startCells.push(position);
                    };
                    if (cells.some(v => occupiedCells.indexOf(v) >= 0)) {
                        collision = true;
                    } else {
                        occupiedCells = occupiedCells.concat(cells);
                        shipStartCells = shipStartCells.concat(startCells);

                        //for (const i of occupiedCells) {
                        //    document.getElementById(i).draggable = true;
                        //    document.getElementById(i).classList.add("drag");
                        //};
                        return [position, rotation];
                    };
                };
            } while (collision && random);

            if (collision) {
                return false;
            };
        };

        ships = [];
        occupiedCells = [];

        // This corresponds directly to occupiedCells, where each
        // index of shipStartCells is the starting cell of the
        // ship on the cell at the same index in occupiedCells.
        shipStartCells = [];

        // Milestone 2: starting position for ships
        function randomizeShips(first = false) {
            cells = document.getElementsByClassName("cell");
            if (!first) {
                shipNodes = [];
                shipNodes.push(document.getElementById("carrier"));
                shipNodes.push(document.getElementById("battleship"));
                shipNodes.push(document.getElementById("cruiser"));
                shipNodes.push(document.getElementById("submarine"));
                shipNodes.push(document.getElementById("destroyer"));
                for (const element of shipNodes) {
                    if (element.parentNode) {
                        element.parentNode.removeChild(element);
                    };
                };
            };
            ships = [];
            occupiedCells = [];
            shipStartCells = [];
            carrier = initShip(5, true);
            createShip(carrier[0], 5, carrier[1], "carrier");
            battleship = initShip(4, true);
            createShip(battleship[0], 4, battleship[1], "battleship");
            cruiser = initShip(3, true);
            createShip(cruiser[0], 3, cruiser[1], "cruiser");
            submarine = initShip(3, true);
            createShip(submarine[0], 3, submarine[1], "submarine");
            destroyer = initShip(2, true);
            createShip(destroyer[0], 2, destroyer[1], "destroyer");
        };

        randomizeShips(true);

        function replaceShip(cell, random = false, shipRot = selectedShip.dataset.direction) {
            shipType = selectedShip.dataset.shipType;
            node = document.getElementById(shipType);
            oldCell = selectedShip.dataset.startCell;
            shipX = letters.indexOf(oldCell[0]) + 1;
            shipY = parseInt(oldCell.slice(1));
            newX = letters.indexOf(cell[0]) + 1;
            newY = parseInt(cell.slice(1));
            shipLength = parseInt(selectedShip.dataset.length);
            oldOccupied = Array.from(occupiedCells);
            oldStartCells = Array.from(shipStartCells);

            if (node.parentNode) {
                node.parentNode.removeChild(node);
            };

            cellIndex = occupiedCells.indexOf(oldCell);

            //for (const i of occupiedCells) {
            //    document.getElementById(i).draggable = false;
            //    document.getElementById(i).classList.remove("drag");
            //};

            occupiedCells.splice(cellIndex, shipLength);
            shipStartCells.splice(cellIndex, shipLength);

            for (const ship in ships) {
                if (ships[ship].dataset.startCell === oldCell) {
                    ships.splice(ship, 1);
                    break;
                };
            };

            if (random) {
                newShip = initShip(shipLength, true);
                createShip(createShip(newShip[0], shipLength, newShip[1], shipType));
                for (const ship in ships) {
                    if (ships[ship].dataset.startCell === newShip[0]) {
                        selectedShip = ships[ship];
                        selectedShip.classList.add("selected");
                        break;
                    };
                };
                return;
            };

            newShip = initShip(shipLength, false, newX, newY, shipRot);
            if (newShip !== false) {
                createShip(newShip[0], shipLength, newShip[1], shipType);
                for (const ship in ships) {
                    if (ships[ship].dataset.startCell === cell) {
                        selectedShip = ships[ship];
                        break;
                    };
                };
                return true;
            } else {
                occupiedCells = oldOccupied;
                shipStartCells = oldStartCells;
                //for (const i of occupiedCells) {
                //    document.getElementById(i).draggable = true;
                //    document.getElementById(i).classList.add("drag");
                //};
                createShip(oldCell, shipLength, selectedShip.dataset.direction, shipType);
                for (const ship in ships) {
                    if (ships[ship].dataset.startCell === oldCell) {
                        selectedShip = ships[ship];
                        break;
                    };
                };
                return false;
            };
        };

        selectedShip = null;
        for (const element of cellList) {
            element.addEventListener("click", function(event) {
                if (!gameStart) {
                    clearFakeShip();
                    cell = element.id;
                    index = occupiedCells.indexOf(cell);
                    if (index !== -1) {
                        var startCell = shipStartCells[index];
                        newSelection = true;
                        if (selectedShip !== null) {
                            if (selectedShip.dataset.startCell === startCell) {
                                newSelection = false;
                                selectedShip.classList.remove("selected");
                                selectedShip = null;
                            };
                        };
                        if (newSelection) {
                            if (selectedShip !== null) {
                                selectedShip.classList.remove("selected");
                                selectedShip = null;
                            };

                            for (const ship in ships) {
                                if (ships[ship].dataset.startCell === startCell) {
                                    selectedShip = ships[ship];
                                    break;
                                };
                            };
                        };

                    } else if (selectedShip !== null) {
                        replaceShip(cell);
                    };

                    if(selectedShip !== null) {
                        selectedShip.classList.add("selected");
                    };
                };
            });

            element.addEventListener("mouseover", function(event) {
                index = occupiedCells.indexOf(element.id);
                if (index !== -1) {
                    startCell = shipStartCells[index];
                    var hoverShip;
                    for (const ship in ships) {
                        if (ships[ship].dataset.startCell === startCell) {
                            hoverShip = ships[ship];
                            break;
                        };
                    };
                    for (i = 0; i < shipStartCells.length; i++) {
                        if (shipStartCells[i] === hoverShip.dataset.startCell) {
                            if (occupiedCells[i] !== element.id) {
                                document.getElementById(occupiedCells[i]).classList.add("hover");
                            };
                        };
                    };
                };
            });

            element.addEventListener("mouseleave", function(event) {
                index = occupiedCells.indexOf(element.id);
                if (index !== -1) {
                    startCell = shipStartCells[index];
                    var hoverShip;
                    for (const ship in ships) {
                        if (ships[ship].dataset.startCell === startCell) {
                            hoverShip = ships[ship];
                            break;
                        };
                    };
                    for (i = 0; i < shipStartCells.length; i++) {
                        if (shipStartCells[i] === hoverShip.dataset.startCell) {
                            if (occupiedCells[i] !== element.id) {
                                document.getElementById(occupiedCells[i]).classList.remove("hover");
                            };
                        };
                    };
                };
            });

            element.addEventListener("mousedown", function(event) {
                clearFakeShip();
            });

            element.addEventListener("mouseup", function(event) {
                clearFakeShip();
            });

            element.addEventListener("dragstart", function(event) {
                clearFakeShip();
                var cellId;
                elementList = document.elementsFromPoint(event.clientX, event.clientY);
                for (const element of elementList) {
                    if (element.classList[0] === "cell") {
                        cellId = element.id;
                        break;
                    };
                };
                i = occupiedCells.indexOf(cellId);
                if (i !== -1) {
                    startCell = shipStartCells[i];
                    var dship;
                    for (const ship in ships) {
                        if (ships[ship].dataset.startCell === startCell) {
                            dship = ships[ship];
                            break;
                        };
                    };

                    dragOffset = i - shipStartCells.indexOf(startCell);
                    if (selectedShip !== null) {
                        selectedShip.classList.remove("selected");
                    };
                    selectedShip = dship;
                    selectedShip.classList.add("selected");
                    /*if (dragOffset !== 0) {
                        selectedShip.hidden = true;
                        createShip(
                            cellId,
                            dship.dataset.length,
                            dship.dataset.direction,
                            dship.dataset.shipType,
                            dragOffset,
                            true
                        );
                    };*/
                    draggedShip = dship;
                };
            });
        };

        function clearFakeShip() {
            if (fakeShip !== null) {
                if (fakeShip.parentNode) {
                    fakeShip.parentNode.removeChild(fakeShip);
                };
                fakeShip = null;
                for (const ship of ships) {
                    ship.hidden = false;
                };
            };
        };

        // using r or arrow keys to rotate ships
        document.addEventListener("keydown", function(event) {
            if (!gameStart) {
                if (!selectedShip) {
                    return;
                };

                for (i = 0; i < shipStartCells.length; i++) {
                    if (shipStartCells[i] === selectedShip.dataset.startCell) {
                        document.getElementById(occupiedCells[i]).classList.remove("hover");
                    };
                };

                if (event.key.toLowerCase() !== "r" && event.key !== "ArrowLeft" &&
                event.key !== "ArrowRight") {
                    return;
                };

                cell = selectedShip.dataset.startCell;
                if (selectedShip.dataset.direction === "horizontal") {
                    replaceShip(cell, false, "vertical");
                } else {
                    replaceShip(cell, false, "horizontal");
                };

                if(selectedShip !== null) {
                    selectedShip.classList.add("selected");
                };
            };
        });

        document.querySelectorAll(".cell").forEach(cell => {
            cell.addEventListener("dragover", function(event) {
                event.preventDefault();

                if(!draggedShip) {
                    return;
                };

                shipCells = [];

                if (selectedShip !== null) {
                    selectedShip.classList.remove("selected");
                    selectedShip = null;
                };

                for (const ship in ships) {
                    if (ships[ship].dataset.startCell === draggedShip.dataset.startCell) {
                        selectedShip = ships[ship];
                        selectedShip.classList.add("selected");
                        break;
                    };
                };

                var cellId;

                //clearHighlights();
                if (draggedShip.dataset.startCell === cell.id || occupiedCells.includes(cell.id)) {
                    elementList = document.elementsFromPoint(event.clientX, event.clientY);
                    for (const element of elementList) {
                        if (element.classList[0] === "cell") {
                            cellId = element.id;
                            break;
                        };
                    };
                } else {
                    cellId = cell.id;
                };

                if (dragOffset != 0) {
                    i = grid.indexOf(cellId);
                    if (selectedShip.dataset.direction === "horizontal") {
                        cellId = grid[i - dragOffset];
                    } else {
                        cellId = grid[i - (10 * dragOffset)];
                    };
                };

                const cells=
                    getCoveredCells(
                        cellId,
                        parseInt(draggedShip.dataset.length),
                        draggedShip.dataset.direction
                );

                if (cells === null) {
                    return;
                };

                for (const cell of document.getElementsByClassName("invalid-drop")) {
                    if (!cells.includes(cell.id)) {
                        cell.classList.remove("invalid-drop");
                    };
                };
                for (const cell of document.getElementsByClassName("valid-drop")) {
                    if (!cells.includes(cell.id)) {
                        cell.classList.remove("valid-drop");
                    };
                };

                cells.forEach(id => {
                    curCell = document.getElementById(id);
                    if (occupiedCells.includes(curCell.id) && (shipStartCells[occupiedCells.indexOf(curCell.id)] !== draggedShip.dataset.startCell)) {
                        if (!(curCell.classList.contains("invalid-drop"))) {
                            curCell.classList.add("invalid-drop");
                        };
                    } else if (!(curCell.classList.contains("valid-drop"))) {
                        curCell.classList.add("valid-drop");
                    };
                });

            });

            cell.addEventListener("dragleave", function(event) {
                clearHighlights();
            });

            cell.addEventListener("drop", function(event) {
                event.preventDefault();

                if(!draggedShip) {
                    return;
                };

                clearFakeShip();

                for (i = 0; i < shipStartCells.length; i++) {
                    if (shipStartCells[i] === draggedShip.dataset.startCell) {
                            document.getElementById(occupiedCells[i]).classList.remove("hover");
                    };
                };

                if (draggedShip.dataset.startCell === cell.id) {
                    elementList = document.elementsFromPoint(event.clientX, event.clientY);
                    for (const element of elementList) {
                        if (element.classList[0] === "cell") {
                            cellId = element.id;
                            break;
                        };
                    };
                } else {
                    cellId = cell.id;
                };

                if (dragOffset != 0) {
                    i = grid.indexOf(cellId);
                    if (selectedShip.dataset.direction === "horizontal") {
                        cellId = grid[i - dragOffset];
                    } else {
                        cellId = grid[i - (10 * dragOffset)];
                    };
                };

                success = false;

                if (cellId !== undefined) {
                    success = replaceShip(cellId);
                };

                if (!success) {
                    cellId = draggedShip.dataset.startCell;
                };

                clearHighlights();
                draggedShip = null;
                selectedShip.classList.remove("selected");
                selectedShip = null;
                for (const ship in ships) {
                    if (ships[ship].dataset.startCell === cellId) {
                        selectedShip = ships[ship];
                        selectedShip.classList.add("selected");
                        break;
                    };
                };
            });
        });

        // saves ship location after submission
        function collectShips() {
            const shipData = [];
            ships.forEach(ship => {
                shipData.push({
                    startCell: ship.dataset.startCell,
                    length: (ship.dataset.length),
                    direction: ship.dataset.direction,
                    type: ship.dataset.shipType
                });
            });
            return shipData;
        };

        document
        .getElementById("ready-button")
        .addEventListener("click", function() {
            clearFakeShip();
            randButton = document.getElementById("randomize-button");
            if (randButton.parentNode) {
                randButton.parentNode.removeChild(randButton);
            };

            if (selectedShip !== null) {
                selectedShip.classList.remove("selected");
                selectedShip = null;
            };
            gameStart = true;
            localStorage.setItem("occupiedCells", occupiedCells);
            fetch("/save_ships",{
                method: "POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                room_code: localStorage.getItem("roomCode"),
                player: localStorage.getItem("playerRole"),
                ships: collectShips()
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    fetch("/player_ready", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            room_code: localStorage.getItem("roomCode"),
                            player: localStorage.getItem("playerRole")
                        })
                    })
                    .then(() => {
                        window.location.href = "/waiting";
                    });

                } else {
                    alert(data.message);
                };
            });
        });

        document.getElementById("randomize-button").addEventListener("click", function() {
            clearFakeShip();
            //for (const i of occupiedCells) {
            //    document.getElementById(i).draggable = false;
            //    document.getElementById(i).classList.remove("drag");
            //};
            if (selectedShip !== null) {
                replaceShip("A1", true);
                //selectedShip.classList.remove("selected");
                //selectedShip = null;
            } else {
                randomizeShips();
            };
        });

    </script>

</body>
</html>
