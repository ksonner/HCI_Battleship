
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='battleship.css') }}">
      
</head>

<body>

    <h1>Battleship</h1>

    <div class="board-container">

        <!-- Top Labels -->
        <div class="top-labels">
            <div class="corner"></div>
            <div>A</div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
            <div>E</div>
            <div>F</div>
            <div>G</div>
            <div>H</div>
            <div>I</div>
            <div>J</div>
        </div>

        <!-- Game Grid -->
        <div class="board">

            {% for row in range(1, 11) %}

                <div class="row-label">{{ row }}</div>

                {% for col in range(10) %}

                    <div class="cell"
                         id="{{ ('ABCDEFGHIJ'[col]) }}{{ row }}">
                    </div>

                {% endfor %}

            {% endfor %}

        </div>

    </div>

    <!-- Milestone 2: Create detailed ships on the Battleship board -->
    <script>

        // Milestone 2: Create a ship using its starting cell, length, and direction
        function createShip(startCell, length, direction, shipType) {

            // Milestone 2: Find the starting cell
            const cell = document.getElementById(startCell);

            if (!cell) {
                return;
            }

            // Milestone 2: Create the main ship container
            const ship = document.createElement("div");
            ship.classList.add("ship", direction, shipType);

            // Milestone 2: Set the ship size based on its length
            const shipLength = length * 50 - 8;
            ship.style.width = shipLength + "px";
            ship.style.height = "34px";

            // Milestone 2: Create the metallic ship hull
            const hull = document.createElement("div");
            hull.classList.add("ship-hull");
            ship.appendChild(hull);

            // Milestone 2: Create the raised deck
            const deck = document.createElement("div");
            deck.classList.add("ship-deck");
            ship.appendChild(deck);

            // Milestone 2: Create the command bridge
            const bridge = document.createElement("div");
            bridge.classList.add("ship-bridge");
            ship.appendChild(bridge);

            // Milestone 2: Create the front gun turret
            const frontTurret = document.createElement("div");
            frontTurret.classList.add("ship-turret", "front-turret");
            ship.appendChild(frontTurret);

            // Milestone 2: Create the rear gun turret
            const rearTurret = document.createElement("div");
            rearTurret.classList.add("ship-turret", "rear-turret");
            ship.appendChild(rearTurret);

            // Milestone 2: Add small details to the ship deck
            const detail = document.createElement("div");
            detail.classList.add("ship-detail");
            ship.appendChild(detail);

            // Milestone 2: Position horizontal and vertical ships
            if (direction === "horizontal") {
                ship.style.left = "4px";
                ship.style.top = "8px";
            } else {
                ship.style.left = "calc(50% + 17px)";
                ship.style.top = "4px";
                ship.style.transformOrigin = "top left";
                ship.style.transform = "rotate(90deg)";
            }

            // Milestone 2: Add the completed ship to the board
            cell.appendChild(ship);
        }

        // Milestone 2: Add the five Battleship ships
        createShip("A1", 5, "horizontal", "carrier");
        createShip("G2", 4, "vertical", "battleship");
        createShip("B5", 3, "horizontal", "cruiser");
        createShip("F8", 3, "horizontal", "submarine");
        createShip("J7", 2, "vertical", "destroyer");

    </script>

</body>
</html>
