<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='create_game.css') }}">
</head>
<body>

    <div class="container">
        <h1>Create Game</h1>

        <div class="code-box" id="roomCode">
            Loading...
        </div>

        <p>Share this code with the other player.</p>

        <p id="status">Waiting for another player... </p>
    </div>

    <script>
        let roomCode = "";

        async function createGame() {
            const response = await fetch('/new_game', {
                method: 'POST'
            });

            const data = await response.json();

            roomCode = data.room_code;

            document.getElementById('roomCode').textContent =
                roomCode;

            setInterval(checkGameStatus, 1000); 
        }

    async function checkGameStatus() {
        
        if (roomCode === "") {
            return;
        }
        const response = await fetch(`/game_status/${roomCode}`);    
        

        const data = await response.json();

        console.log("Game status:", data);

        if (data.ready) {
            document.getElementById('status').textContent =
                "Both players are connected! Starting game...";

            window.location.href = "/battleship";
        }
    }
     

        createGame();
    </script>

</body>
</html>
