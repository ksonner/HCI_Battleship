<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='waiting.css') }}">
      
</head>

        
<body>

<h1>Waiting For Opponent</h1>
<p>
    Waiting for the other player
    to finish placing ships...
</p>

<div id="start-popup" class="popup">
    Both Players Are Ready!
    <br></br>
    Game starts in 5 seconds...
</div>

<script>

    const room_code = 
    localStorage.getItem("roomCode");

    let gameStarting = false;

    // check every second if the both players are ready
    setInterval(() => {
        fetch(
            `/ready_status/${localStorage.getItem("roomCode")}`
        )
        .then(response => response.json())
        .then(data => {
            if (data.ready && !gameStarting) {
                gameStarting = true;
                document.getElementById("start-popup").style.display = "block";
                setTimeout(() => {
                    window.location.href = "/game_play";
                }, 5000);
            }
        });
    }, 1000);


</script>
</body>
</head>
